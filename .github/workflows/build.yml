name: Test, build and deploy

on:
  push:
    branches: [main, develop, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubeverse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache exact Godot release and templates
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot
            .tools/data/godot/export_templates
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-exports-v1
      - name: Install Godot
        shell: bash
        run: |
          mkdir -p .tools/godot
          if [ ! -x .tools/godot/godot ]; then
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .tools/godot/editor.zip
            unzip -q .tools/godot/editor.zip -d .tools/godot
            mv ".tools/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" .tools/godot/godot
            chmod +x .tools/godot/godot
          fi
          echo "GODOT_BIN=$GITHUB_WORKSPACE/.tools/godot/godot" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$GITHUB_WORKSPACE/.tools/data" >> "$GITHUB_ENV"
      - name: Install official export templates
        run: python3 tools/install_templates.py
      - name: Test and build Web and Android
        run: tools/build.sh all
      - name: Write measured deployment status
        run: python3 tools/write_build_status.py
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: build/reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeVerse-3D-debug-${{ github.sha }}
          path: build/android/CubeVerse-3D-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Upload web export
        uses: actions/upload-artifact@v4
        with:
          name: CubeVerse-3D-web-${{ github.sha }}
          path: build/web/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy verified web build
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CubeVerse-3D-debug-${{ github.sha }}
          path: release/
      - name: Publish tested debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          CubeVerse 3D 개발 테스트 빌드입니다.

          이 APK는 디버그 키로 서명되어 있습니다. Google Play 정식 출시용이 아닙니다.
          자동 엔진 테스트와 APK 내보내기는 이 태그의 Actions 실행에서 확인할 수 있습니다.
          Android 실기기 성능·햅틱 검증 상태와 미구현 기능은 TEST_REPORT.md 및 PROGRESS.md를 확인하세요.
          EOF
          gh release create "$GITHUB_REF_NAME" release/CubeVerse-3D-debug.apk --title "CubeVerse 3D $GITHUB_REF_NAME" --notes-file release-notes.md --prerelease --verify-tag
